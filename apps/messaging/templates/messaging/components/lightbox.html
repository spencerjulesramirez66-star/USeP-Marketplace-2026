{# Fullscreen media viewer dialog. #}
<dialog class="messaging-lightbox" id="messaging-lightbox" aria-label="Media viewer"><button type="button" class="messaging-lightbox-close" aria-label="Close media viewer"><i class="bi bi-x-lg" aria-hidden="true"></i></button><button type="button" class="messaging-lightbox-prev" aria-label="Previous image"><i class="bi bi-chevron-left" aria-hidden="true"></i></button><img alt=""><button type="button" class="messaging-lightbox-next" aria-label="Next image"><i class="bi bi-chevron-right" aria-hidden="true"></i></button><span class="messaging-lightbox-count"></span></dialog>
