<dialog class="transaction-drawer" id="transaction-drawer" aria-labelledby="transaction-drawer-title">
    <div class="transaction-drawer-header">
        <div><p class="eyebrow">Transaction details</p><h2 id="transaction-drawer-title">Transaction</h2></div>
        <button type="button" class="transaction-icon-button" data-drawer-close aria-label="Close details"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    </div>
    <div class="transaction-drawer-content" id="transaction-drawer-content">
        <p class="transaction-drawer-loading">Select a transaction to view its details.</p>
    </div>
</dialog>
