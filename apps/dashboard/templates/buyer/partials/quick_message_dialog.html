<dialog class="quick-message" id="quick-message-dialog" aria-labelledby="quick-message-title">
    <form class="quick-message__form" method="post" novalidate>
        {% csrf_token %}
        <header class="quick-message__header">
            <h3 id="quick-message-title">Message seller</h3>
            <button type="button" class="quick-message__close" data-message-close aria-label="Close">&times;</button>
        </header>

        <div class="quick-message__listing">
            <img class="quick-message__thumb" alt="" width="56" height="56">
            <div>
                <strong class="quick-message__item-title"></strong>
                <small class="quick-message__item-meta"></small>
            </div>
        </div>

        <label class="visually-hidden" for="quick-message-body">Your message</label>
        <textarea id="quick-message-body" name="body" rows="4" maxlength="2000"
                  placeholder="Ask the seller about this listing..." required></textarea>

        <div class="quick-message__chips" aria-label="Quick replies">
            <button type="button" data-chip="Hi! Is this still available?">Is this still available?</button>
            <button type="button" data-chip="Hi! Is the price negotiable?">Is the price negotiable?</button>
            <button type="button" data-chip="Hi! Where can we meet on campus?">Where can we meet?</button>
        </div>

        <p class="quick-message__error" role="alert" hidden></p>

        <footer class="quick-message__actions">
            <span class="quick-message__count"><span data-count>0</span>/2000</span>
            <button type="button" class="quick-message__cancel" data-message-close>Cancel</button>
            <button type="submit" class="quick-message__send">Send message</button>
        </footer>
    </form>
</dialog>
